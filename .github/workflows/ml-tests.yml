name: NLP baseline tests

on:
  push:
    branches: [main, master]
    paths:
      - 'cnc_ml/**'
      - 'tests/ml/**'
      - 'requirements-ml.txt'
      - '.github/workflows/ml-tests.yml'
  pull_request:
    paths:
      - 'cnc_ml/**'
      - 'tests/ml/**'
      - 'requirements-ml.txt'
      - '.github/workflows/ml-tests.yml'

permissions:
  contents: read

jobs:
  nlp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-ml.txt
      - run: python -m unittest discover -s tests/ml -v
