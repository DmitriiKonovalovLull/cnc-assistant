version: '3.8'

services:
  bot:
    build: .
    container_name: cnc_assistant_bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://cnc_user:cnc_pass@postgres:5432/cnc_db
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./logs:/app/logs
      - ./app/storage:/app/app/storage
      - ./standards/storage:/app/standards/storage
    depends_on:
      - postgres
      - redis
    networks:
      - cnc_network

  api:
    build: .
    container_name: cnc_assistant_api
    restart: unless-stopped
    command: python -m app.main
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://cnc_user:cnc_pass@postgres:5432/cnc_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - postgres
      - redis
    networks:
      - cnc_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  postgres:
    image: postgres:15-alpine
    container_name: cnc_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=cnc_user
      - POSTGRES_PASSWORD=cnc_pass
      - POSTGRES_DB=cnc_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - cnc_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cnc_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cnc_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - cnc_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:

networks:
  cnc_network:
    driver: bridge
