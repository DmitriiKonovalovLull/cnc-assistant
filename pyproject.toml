[project]
name = "cnc-assistant"
version = "0.1.0"
description = "AI-like industrial assistant for CNC operators"
readme = "README.md"
requires-python = ">=3.10"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["app"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
